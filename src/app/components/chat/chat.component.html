<div class="chat-layout">
  <mat-toolbar class="chat-toolbar">
    <button mat-icon-button type="button" (click)="toggleSidenav()">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="app-name">AI Chat Assistant</span>
    <span class="toolbar-spacer"></span>
    <button mat-icon-button type="button" [matMenuTriggerFor]="userMenu" class="avatar-btn">
      <span class="user-avatar">{{ userInitial() }}</span>
    </button>
    <mat-menu #userMenu="matMenu">
      <button mat-menu-item type="button" (click)="goToProfile()">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </button>
      <button mat-menu-item type="button" (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Logout</span>
      </button>
    </mat-menu>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav
      #sidenav
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="!isMobile()"
      class="chat-sidenav"
    >
      <app-chat-history
        [activeConversationId]="activeConversation()?.id ?? ''"
        (conversationSelected)="onConversationSelected($event)"
        (newChat)="onNewChat()"
      />
    </mat-sidenav>

    <mat-sidenav-content class="chat-content">
      @if (activeConversation(); as conv) {
        <app-chat-window [conversation]="conv" />
      } @else {
        <div class="no-conversation">
          <mat-icon>chat_bubble_outline</mat-icon>
          <p>Select a conversation or start a new chat</p>
        </div>
      }
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
